// Compose stability configuration for :app.
// :core is a plain Kotlin/JVM module that the Compose compiler does not process, so it cannot infer
// that the engine types are stable. Every public :core type is deeply immutable: valid-by-construction
// data classes with val properties, enums and read-only lists built internally. Declaring them
// stable lets composables that take GregorianDate, ThirteenDate, DayCell, layouts or Comparison
// skip recomposition when their arguments are equal.
com.haugas.thirteen.core.**
