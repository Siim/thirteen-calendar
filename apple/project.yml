# XcodeGen spec for the Thirteen apps. The generated Thirteen.xcodeproj is not committed:
#   cd apple && xcodegen generate        (or: pnpm apple:gen)
name: Thirteen

options:
  bundleIdPrefix: com.haugas
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  # An Icon Composer document (.icon) is a folder; without this XcodeGen adds its contents as loose
  # resources instead of the one bundle that actool compiles into the app icon.
  fileTypes:
    icon:
      file: true
      buildPhase: resources
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

packages:
  ThirteenKit:
    path: ThirteenKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    # Release versions (see docs/RELEASING.md). MARKETING_VERSION is the user-facing x.y.z shared
    # by every platform; CURRENT_PROJECT_VERSION is the build number: +1 for every App Store
    # Connect upload, never reset.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CODE_SIGN_STYLE: Automatic
    # Haugas Development OU. Simulator and ad-hoc ("-") Mac builds still work without its
    # certificates; archives and exports use them (scripts/release/).
    DEVELOPMENT_TEAM: 5ZJ9N8WURW

targets:
  # iPhone + iPad app.
  Thirteen:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Shared
      - path: iOS
      # The mockup data set (docs/EVENTS.md §6.7) that FakeCalendarStore loads (-ThirteenQAEvents fake,
      # previews, tests): referenced in place from fixtures/, never copied.
      - path: ../fixtures/mockup/mockup-events.json
        group: Shared/Resources
        buildPhase: resources
    dependencies:
      - package: ThirteenKit
    info:
      # Written by XcodeGen on every `generate` (the rest of the Info.plist is generated by Xcode
      # from the INFOPLIST_KEY_* settings below, since URL types have no build-setting form).
      path: Generated/Thirteen-iOS-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.haugas.thirteen
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [thirteen]
        # The type of an event dragged inside Thirteen (EventDragItem, docs/EVENTS.md §6.2 drag and drop).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.haugas.thirteen.event
            UTTypeDescription: Thirteen event
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
    settings:
      base:
        PRODUCT_NAME: Thirteen
        PRODUCT_BUNDLE_IDENTIFIER: com.haugas.thirteen
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thirteen
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Haugas Development OU"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Calendar access (docs/EVENTS.md §6.2, §2.19 purpose.apple): full access only, no write-only key and no
        # legacy NSCalendarsUsageDescription (TN3152). scripts/release/ios-upload.sh fails without it.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Thirteen shows the events from your calendars in its 13-month views and saves the events you add or change to the calendar you choose."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  # macOS app (sandboxed), same Shared sources plus the menu bar extra and Settings scene.
  Thirteen Mac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Shared
      - path: macOS
        excludes:
          - "*.entitlements"
      # The app icon: the Icon Composer document of design/icon (the same "Page 13" artwork as the
      # iOS asset catalog, from the same build). actool prefers it over the AppIcon.appiconset of
      # the same name, and macOS 26 and 27 give it their own squircle and glass rim.
      - path: ../design/icon/exports/apple/AppIcon.icon
        group: macOS
      - path: ../fixtures/mockup/mockup-events.json
        group: Shared/Resources
        buildPhase: resources
    dependencies:
      - package: ThirteenKit
    info:
      path: Generated/Thirteen-macOS-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.haugas.thirteen.mac
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [thirteen]
        # The type of an event dragged inside Thirteen (EventDragItem, docs/EVENTS.md §6.2 drag and drop).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.haugas.thirteen.event
            UTTypeDescription: Thirteen event
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
    entitlements:
      path: macOS/Thirteen.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # EventKit under App Sandbox and Hardened Runtime (§6.2); checked by scripts/release/mac-dmg.sh.
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_NAME: Thirteen
        PRODUCT_MODULE_NAME: ThirteenMac
        # Same bundle id as the iOS app, so a Mac App Store build could later join the same App
        # Store record (universal purchase). The Developer ID DMG uses it too.
        PRODUCT_BUNDLE_IDENTIFIER: com.haugas.thirteen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thirteen
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Haugas Development OU"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The same purpose string as the iOS app (§6.2); scripts/release/mac-dmg.sh fails without it.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Thirteen shows the events from your calendars in its 13-month views and saves the events you add or change to the calendar you choose."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_IDENTITY: "-"

  # Logic tests for the app model (deep links, Calendar modes and paging, phrasing, 13-month picker),
  # the events model and undo (EventsModel, EventUndo on the fake store) and the themes (groups,
  # forced dark, the Appearance setting, colours). The sources are compiled straight into the
  # bundle, so the tests run without launching an app.
  ThirteenAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
      - path: Shared/App/AppModel.swift
      - path: Shared/App/AppState.swift
      - path: Shared/App/AppSection.swift
      - path: Shared/App/DeepLink.swift
      - path: Shared/App/CalendarMode.swift
      - path: Shared/Support/Phrasing.swift
      - path: Shared/Support/QAOptions.swift
      - path: Shared/Features/Calendar/TimelineAxis.swift
      - path: Shared/Features/Convert/ThirteenPickerLogic.swift
      - path: Shared/Features/Year/YearGridLayout.swift
      - path: Shared/Design/ThemeTokens.swift
      - path: Shared/Design/Palette.swift
      - path: Shared/Design/Appearance.swift
      - path: Shared/Design/Hatch.swift
      # Calendar stores and mappings (docs/EVENTS.md §6.2): the protocol, FakeCalendarStore, the
      # EventKit mappings and EventKitStore. The tests build EventKit values without an EKEventStore,
      # so nothing here asks for calendar access on the Mac.
      - path: Shared/Events
      - path: ../fixtures/mockup/mockup-events.json
        group: Shared/Resources
        buildPhase: resources
      - path: ../fixtures/events.json
        group: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - package: ThirteenKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haugas.thirteen.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  # EventKit tests against a real calendar store (docs/EVENTS.md §6.2, task A2): unit tests hosted in
  # the iOS app, so they run as com.haugas.thirteen and use its Calendars grant. iOS Simulator only:
  # apple/scripts/eventkit-tests.sh creates a private simulator, grants it calendar access with
  # `xcrun simctl privacy <udid> grant calendar com.haugas.thirteen`, runs them and deletes it.
  # They never run on a Mac, so no Mac privacy prompt can appear.
  ThirteenEventKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: EventKitTests
      - path: ../fixtures/events.json
        group: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Thirteen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haugas.thirteen.eventkit-tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Thirteen.app/Thirteen"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # UI tests in an iOS Simulator (docs/EVENTS.md §6.2 ThirteenUITests): the events screens on the
  # fake store (`-ThirteenQAEvents fake`, the mockup data set), never EventKit. Task A7 added the
  # editor flows (EventEditorUITests); task A10 adds the rest. apple/scripts/ui-tests.sh runs them.
  ThirteenUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    dependencies:
      - target: Thirteen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haugas.thirteen.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Thirteen

schemes:
  Thirteen:
    build:
      targets:
        Thirteen: all
    run:
      config: Debug
    archive:
      config: Release

  Thirteen Mac:
    build:
      targets:
        Thirteen Mac: all
        ThirteenAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThirteenAppTests
    archive:
      config: Release

  # The EventKit tests in an iOS Simulator (apple/scripts/eventkit-tests.sh).
  Thirteen EventKit Tests:
    build:
      targets:
        Thirteen: all
        ThirteenEventKitTests: [test]
    test:
      config: Debug
      targets:
        - ThirteenEventKitTests

  # The UI tests in an iOS Simulator (apple/scripts/ui-tests.sh).
  Thirteen UI Tests:
    build:
      targets:
        Thirteen: all
        ThirteenUITests: [test]
    test:
      config: Debug
      targets:
        - ThirteenUITests
